<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GYANDEEP QUIZ APP - Login</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#061b3a,#0b5ed7);
}

.login-box{
    width:90%;
    max-width:400px;
    background:white;
    padding:35px 25px;
    border-radius:20px;
    box-shadow:0 10px 35px rgba(0,0,0,0.3);
    text-align:center;
}

.logo{
    font-size:32px;
    font-weight:bold;
    color:#0b5ed7;
    margin-bottom:8px;
}

.subtitle{
    color:#666;
    margin-bottom:30px;
}

.input-box{
    text-align:left;
    margin-bottom:18px;
}

.input-box label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
    color:#333;
}

.input-box input{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
    outline:none;
}

.input-box input:focus{
    border-color:#0b5ed7;
}

.login-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#0b5ed7;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.login-btn:hover{
    background:#084298;
}

.message{
    margin-top:15px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">GYANDEEP</div>
    <div class="subtitle">QUIZ APP</div>

    <div class="input-box">
        <label>Username</label>
        <input type="text" id="username" placeholder="Username डालें">
    </div>

    <div class="input-box">
        <label>Password</label>
        <input type="password" id="password" placeholder="Password डालें">
    </div>

    <button class="login-btn" onclick="login()">
        LOGIN
    </button>

    <div class="message" id="message"></div>

</div>

<script>
function login(){

    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    if(username === "gyan@123" && password === "2056"){

        window.location.href = "subjects.html";

    }else{

        document.getElementById("message").style.color = "red";
        document.getElementById("message").innerText =
        "Username या Password गलत है ❌";
    }
}

</script>

</body>
</html>
